<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img">
  <title>Damero Propiedades</title>
  <!-- OG card source (1200x630). Bake with pnpm bake:og (Chromium).
    Do NOT bake with ImageMagick: its SVG renderer misplaces the
    rotated badge over the wordmark. Single left axis at x=96.
    Raw palette values here are the documented SVG exception class. -->
  <rect width="1200" height="630" fill="#F4F5F3"/>
  <!-- Right-edge watermark: one oversized diamond outline at 8% opacity.
    Single left axis at x=96 for badge, text and rule: nothing is centred. -->
  <g transform="translate(1090,315) rotate(45)" opacity="0.08">
    <rect x="-200" y="-200" width="400" height="400" fill="none" stroke="#3E4837" stroke-width="2"/>
  </g>
  <!-- Brand cluster above the wordmark: nested squares read as diamonds. -->
  <g transform="translate(164,150) rotate(45)">
    <rect x="-48" y="-48" width="96" height="96" rx="4" fill="#3E4837"/>
    <rect x="-27" y="-27" width="54" height="54" fill="#FFFFFF"/>
    <rect x="-13" y="-13" width="26" height="26" fill="#7C916F"/>
  </g>
  <text x="96" y="352" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="64" letter-spacing="0" text-anchor="start" fill="#3E4837">Damero Propiedades</text>
  <text x="96" y="410" font-family="Verdana, system-ui, sans-serif" font-size="28" text-anchor="start" fill="#4F6144">Catálogo inmobiliario con respaldo jurídico.</text>
  <text x="96" y="462" font-family="ui-monospace, SFMono-Regular, monospace" font-size="20" letter-spacing="3" text-anchor="start" fill="#5F6B57">DAMEROPROPIEDADES.COM.AR</text>
  <rect x="96" y="520" width="1008" height="1" fill="#DCE1D6"/>
</svg>
