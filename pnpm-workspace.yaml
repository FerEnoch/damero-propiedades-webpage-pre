# Este repo es un SINGLE-PACKAGE: el sitio vive en la raíz.
# No se declara el campo `packages:` a propósito — la doc de pnpm dice que
# cuando se omite, solo el paquete raíz queda incluido en el workspace.
# Este archivo es el contenedor de TODOS los settings de pnpm del repo
# (supply chain + política de instalación). Desde pnpm 11 `.npmrc` solo se
# lee para auth y registry: cualquier otro setting ahí se ignora en silencio.
# Ver: https://pnpm.io/settings

# ─── SUPPLY CHAIN SECURITY ─────────────────────────────────────────
# Bloquea instalar versiones publicadas recientemente (4320 min = 3 días).
# La mayoría de versiones maliciosas se detectan y retiran del registry
# en horas; esperar 3 días elimina prácticamente ese riesgo.
# Aplica a TODAS las dependencias, incluidas transitivas. (pnpm >= 10.16)
# Nota: en pnpm v11 el default es 1440 (1 día); 0 = desactivado.
minimumReleaseAge: 4320

# Excepción PUNTUAL autorizada por el stakeholder (2026-09-18): se usa
# Astro 7.3.3, que tiene ~39 h de publicado, para no quedar en el patch
# anterior. Es la única excepción; el resto del árbol sigue bajo los 3 días.
# OJO: `minimumReleaseAgeStrict` NO se toca — su default es `true` cuando
# `minimumReleaseAge` está seteado, y con `false` pnpm no elige una versión
# más vieja: instala la que viola la cuarentena (bypass, no fallback).
minimumReleaseAgeExclude:
  - 'astro@7.3.3'

# Falla si un paquete BAJA su nivel de confianza respecto a versiones
# anteriores (ej.: antes tenía firma criptográfica, ahora no).
# Detecta paquetes secuestrados que perdieron sus credenciales. (pnpm >= 10.21)
trustPolicy: no-downgrade

# Paquetes mayores a 30 días quedan exentos del trustPolicy:
# legacy sin firma es razonablemente seguro. (pnpm >= 10.27)
trustPolicyIgnoreAfter: 43200  # 30 días en minutos

# Las dependencias TRANSITIVAS solo pueden venir del registry.
# Fuentes exóticas (git, tarball URLs) solo como dependencias directas
# con decisión explícita. (pnpm >= 10.26)
blockExoticSubdeps: true

# Lista blanca de paquetes que pueden ejecutar scripts de instalación
# (preinstall/install/postinstall). Deny-by-default. (pnpm >= 10.27)
# Formato: nombre (todas las versiones) o nombre@version (versión exacta).
# Mantenerla actualizada: si pnpm bloquea un paquete con scripts,
# evaluar si es legítimo y aprobarlo aquí con versión exacta.
# NUNCA usar dangerouslyAllowAllBuilds: true.
allowBuilds:
  # esbuild@0.28.2 — aprobado 2026-09-18.
  # Por qué: bundler de Vite (y por lo tanto de Astro); el scaffold oficial de
  # Astro lo aprueba explícitamente (`allowScripts: {esbuild: true}`). Su
  # postinstall valida el binario nativo.
  # Vetado: repo canónico github.com/evanw/esbuild, publicado 2026-08-08
  # (41 días, pasa la cuarentena), binario @esbuild/linux-x64@0.28.2 ya
  # resuelto por optionalDependencies.
  # Versión EXACTA a propósito: un bump de esbuild (vía Astro/Vite) vuelve a
  # fallar el install hasta que un humano lo revise y apruebe. Esa fricción
  # es el control, no un bug.
  esbuild@0.28.2: true

# Scripts de build no aprobados = ERROR de instalación (no warning).
# Un paquete nuevo con scripts hace fallar CI hasta ser revisado.
strictDepBuilds: true

# ─── POLÍTICA DE INSTALACIÓN (migrada desde .npmrc) ────────────────
# Migrado el 2026-09-18 al subir a pnpm 12.4.2. Los 5 settings de abajo
# vivían en `.npmrc` y con pnpm 12 habían dejado de tener efecto: `.npmrc`
# solo se lee para auth y registry, así que se ignoraban en silencio
# (verificado con `pnpm config get`, que devolvía `undefined` para todos).
# Eso además rompía `pnpm install --frozen-lockfile` en local y en CI.

# En CI/CD: instalar SIEMPRE con `pnpm install --frozen-lockfile`.
# Este setting hace lo mismo localmente: si el lockfile no satisface
# package.json, la instalación falla. Reproducibilidad garantizada.
preferFrozenLockfile: true

# Los peer dependencies faltantes son ERROR, no warning.
strictPeerDependencies: true

# No auto-instalar peers faltantes: deben declararse explícitamente.
# Con strictPeerDependencies=true, un peer faltante falla la instalación.
# Debe quedar en false para coincidir con `settings.autoInstallPeers`
# del lockfile commiteado, o el install frozen falla por mismatch.
autoInstallPeers: false

# Convierte `engines` de package.json en restricción dura:
# node/pnpm fuera de rango = error de instalación.
engineStrict: true

# NO ignorar scripts de instalación: así gobierna la allowlist
# `allowBuilds` + `strictDepBuilds` de arriba. Si esto se pone en true,
# la allowlist deny-by-default deja de evaluarse y los paquetes con
# scripts se omiten en silencio (esbuild/sharp se rompen sin causa).
# Nota: desde pnpm 11 el `ignore-scripts=true` del ~/.npmrc global ya no
# se lee, pero se explicita igual como política del repo.
ignoreScripts: false
