version: 2
updates:
  # Dependencias npm/pnpm (root del workspace)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      runtime-deps:
        dependency-type: production
      dev-deps:
        dependency-type: development
    # Los PRs de dependencias pasan por el CI del repo (frozen + audit + build)
    # y por revisión manual del changelog antes de mergear.
  # Actions de GitHub también son supply chain — mantenerlas actualizadas
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
