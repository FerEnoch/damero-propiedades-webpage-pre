name: supply-chain

# Minimal supply-chain gate: reproducible install + audit + build.
#
# Documentation-only pushes do not run it (same narrow ignore list as
# `acceptance.yml`, which carries the reasoning). Keep this list NARROW: never
# add `src/**`, `public/**`, `e2e/**` or a config file, because an instructed
# employee publishes listings as content markdown plus photos and that push
# must run.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'odd/**'
      - 'docs/**'
      - 'design/**'
      - 'README.md'
      - 'AGENTS.md'
  push:
    branches: [main]
    paths-ignore:
      - 'odd/**'
      - 'docs/**'
      - 'design/**'
      - 'README.md'
      - 'AGENTS.md'

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-audit-build:
    name: Install (frozen) + Audit + Build
    runs-on: ubuntu-latest
    steps:
      # PENDING IMPROVEMENT: pin these actions by commit SHA instead of mutable tags
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Audit (HIGH/CRITICAL blocks)
        run: pnpm audit --audit-level high
      - name: Build
        run: pnpm build
