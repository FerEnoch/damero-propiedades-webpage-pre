name: acceptance

# Acceptance gate: runs the full Playwright e2e suite — the acceptance gate
# declared in AGENTS.md — on every pull request and push to `main`. The suite
# runs against the production build: `playwright.config.ts` builds the site and
# serves it as its `webServer`, so this workflow intentionally has no separate
# build step.
#
# This workflow deliberately carries NO `paths`/`paths-ignore` filter. It used
# to skip documentation-only pushes, but that is incompatible with the branch
# protection this repository relies on: a workflow skipped by a path filter
# creates no check run at all, so a required check is never reported and the
# pull request stays unmergeable forever. GitHub states it verbatim: "You
# should not use path or branch filtering to skip workflow runs if the workflow
# is required to pass before merging." Actions minutes are free on a public
# repository, so the saving the filter bought was nil. Do NOT reintroduce it.
#
# The gate must always run on the push an instructed employee makes in
# production — a markdown file under `src/content/propiedades/` plus its photos
# under `public/`. That is the push that can break the build (schema), the
# routes (dead slugs) and the payload (image limits).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright e2e (1280 / 390 / 320)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # PENDING IMPROVEMENT: pin these actions by commit SHA instead of mutable tags
      - uses: actions/checkout@v7

      # No `version:` input: the `packageManager` field in package.json provides
      # it. Must run before actions/setup-node, otherwise `cache: pnpm` fails.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # PRD §9 check 3. Runs before the browser install on purpose: it is pure
      # Node, needs no build and no chromium, and it is the cheapest place to
      # catch the payload problem an instructed employee can actually ship.
      - name: Check image limits (PRD §9 check 3)
        run: pnpm check:images

      - name: Install chromium (Playwright bundled build)
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the e2e gate
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
