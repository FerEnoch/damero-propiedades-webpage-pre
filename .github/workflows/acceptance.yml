name: acceptance

# Acceptance gate: runs the full Playwright e2e suite — the acceptance gate
# declared in AGENTS.md — on every pull request and push to `main`. The suite
# runs against the production build: `playwright.config.ts` builds the site and
# serves it as its `webServer`, so this workflow intentionally has no separate
# build step.
# Documentation-only pushes do not run the suite: none of `docs/`, `design/`,
# `odd/`, `README.md` or `AGENTS.md` is read by the build or by these specs —
# they are cited from comments only. Keep this list NARROW.
#
# NEVER add `src/**`, `public/**`, `e2e/**` or any config file here. In
# production an instructed employee publishes a listing by committing a
# markdown file under `src/content/propiedades/` plus its photos under
# `public/`, and that is exactly the push that MUST run the gate: it is the one
# that can break the build (schema), the routes (dead slugs) and the payload.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'odd/**'
      - 'docs/**'
      - 'design/**'
      - 'README.md'
      - 'AGENTS.md'
  push:
    branches: [main]
    paths-ignore:
      - 'odd/**'
      - 'docs/**'
      - 'design/**'
      - 'README.md'
      - 'AGENTS.md'

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright e2e (1280 / 390 / 320)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # PENDING IMPROVEMENT: pin these actions by commit SHA instead of mutable tags
      - uses: actions/checkout@v7

      # No `version:` input: the `packageManager` field in package.json provides
      # it. Must run before actions/setup-node, otherwise `cache: pnpm` fails.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install chromium (Playwright bundled build)
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the e2e gate
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
